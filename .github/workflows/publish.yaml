name: Publish Package

on:
  push:
    tags:
      - '*@v*.*.*' # Trigger on tags like chuchi@v1.0.1, core@v1.2.0, legacy@v1.3.0

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Allow reading the repository content
      id-token: write # Required for Trusted Publishing, provenance and JSR
    container:
      image: node:24

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Parse Tag
        run: |
          # Extract the tag name (e.g., core@v1.2.0)
          TAG_NAME="${GITHUB_REF##*/}"
          PACKAGE_SHORT_NAME="${TAG_NAME%@*}"
          VERSION="${TAG_NAME#*@v}"
          if [ "${PACKAGE_SHORT_NAME}" = "chuchi" ]; then
            PACKAGE_FOLDER="chuchi" # Special case for chuchi
          else
            PACKAGE_FOLDER="chuchi-${PACKAGE_SHORT_NAME}" # Add prefix for other packages
          fi
          echo "PACKAGE_SHORT_NAME=${PACKAGE_SHORT_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PACKAGE_FOLDER=${PACKAGE_FOLDER}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # install latest npm for Trusted Publishing
      - run: npm install -g npm@latest

      - name: Check Version
        shell: bash
        run: |
          cd ${PACKAGE_FOLDER}
          PKG_VERSION=$(node -p "require('./package.json').version")
          JSR_VERSION=$(node -p "require('./jsr.json').version")
          if [[ "${PKG_VERSION}" != "${VERSION}" ]]; then
            echo "Tag version ${VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          if [[ "${JSR_VERSION}" != "${VERSION}" ]]; then
            echo "Tag version ${VERSION} does not match jsr.json version ${JSR_VERSION}"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      # we build each package so all dependencies are met
      - name: Build
        run: npm run build

      - name: Check errors
        run: |
          cd ${PACKAGE_FOLDER}
          npm run check

      - name: Run lint
        run: |
          cd ${PACKAGE_FOLDER}
          npm run lint

      - name: Copy Licenses
        run: |
          cp LICENSE-APACHE LICENSE-MIT ${PACKAGE_FOLDER}/

      - name: Publish to npm
        shell: bash
        run: |
          cd ${PACKAGE_FOLDER} # Navigate to the correct package folder
          echo "Publishing package from ${PACKAGE_FOLDER} with version ${VERSION}"

          # Check if the version is a prerelease (contains a hyphen, e.g., 0.2.0-alpha.0)
          if [[ "${VERSION}" == *-* ]]; then
            # Extract the identifier (gets 'alpha' from '0.2.0-alpha.0' or 'rc' from '0.2.0-rc.1')
            DIST_TAG=$(echo "${VERSION}" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')

            # Fallback to 'next' if extraction is empty
            if [[ -z "${DIST_TAG}" ]]; then
              DIST_TAG="next"
            fi

            echo "Prerelease detected. Publishing with --tag ${DIST_TAG}"
            npm publish --provenance --tag ${DIST_TAG}
          else
            echo "Stable release detected. Publishing to latest tag."
            npm publish --provenance
          fi

      - name: Publish to JSR
        run: |
          cd ${PACKAGE_FOLDER} # Navigate to the correct package folder
          echo "Publishing to JSR for package ${PACKAGE_SHORT_NAME}"
          # the copied licenses are not committed
          npx jsr publish --allow-dirty
